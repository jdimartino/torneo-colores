<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin - Torneo de Colores</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&text=account_balance_wallet,add,add_circle,arrow_back,block,calendar_today,campaign,check,check_circle,chevron_left,chevron_right,close,delete,edit,email,emoji_events,error,event,expand_more,file_upload,groups,history,home,how_to_reg,info,leaderboard,lock,login,logout,mail_lock,manage_accounts,mark_email_read,monitoring,paid,palette,payments,pause_circle,people,person_add,person_off,person_remove,phone,progress_activity,receipt_long,refresh,restart_alt,save,search,sell,send,settings,sports_score,sports_tennis,swap_horiz,sync,tune,unfold_less,upload_file,visibility,warning,workspace_premium" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64'%3E%3Cdefs%3E%3CradialGradient id='ball' cx='38%' cy='34%' r='78%'%3E%3Cstop offset='0%' stop-color='%23eaff6a'/%3E%3Cstop offset='55%' stop-color='%23d3f52a'/%3E%3Cstop offset='100%' stop-color='%23a9cf00'/%3E%3C/radialGradient%3E%3CclipPath id='clip'%3E%3Ccircle cx='32' cy='32' r='22'/%3E%3C/clipPath%3E%3C/defs%3E%3Crect x='0' y='0' width='64' height='64' rx='14' fill='%2304132b'/%3E%3Ccircle cx='32' cy='32' r='22' fill='url(%23ball)'/%3E%3Cg clip-path='url(%23clip)' fill='none' stroke='%23ffffff' stroke-width='4.2' stroke-linecap='round'%3E%3Cpath d='M14 15 C28 26, 28 38, 14 49'/%3E%3Cpath d='M50 15 C36 26, 36 38, 50 49'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%238fb700' stroke-width='1' opacity='0.55'/%3E%3Cellipse cx='25' cy='23' rx='6' ry='3.6' fill='%23ffffff' opacity='0.26' transform='rotate(-32 25 23)'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/styles.css?v=25">
</head>
<body class="admin-body">

    <header class="app-header" id="login-section">
        <div class="header-top">
            <div class="header-brand">
                <div>
                    <h1>Torneo de Colores</h1>
                    <div class="header-subtitle"><span class="dot"></span> Admin Panel</div>
                </div>
            </div>
        </div>
        <div class="header-line"></div>
    </header>

    <main>
        <section id="login-container-wrapper">
            <div class="login-container">
                <h2><span class="material-symbols-outlined" style="font-size:1.5rem;vertical-align:middle;">lock</span> Acceso Admin</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="admin@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <div id="login-error" style="display:none;background:var(--error-container);color:white;border:1px solid rgba(255,84,73,0.3);border-radius:8px;padding:0.6rem 0.8rem;margin-bottom:0.75rem;font-size:0.82rem;text-align:center;"></div>
                <button class="btn btn-primary btn-block" id="login-btn">
                    <span class="material-symbols-outlined" style="font-size:1.1rem;">login</span> Ingresar
                </button>
                <a href="index.html" class="btn btn-outline btn-block" style="margin-top:0.5rem;text-decoration:none;text-align:center;">
                    <span class="material-symbols-outlined" style="font-size:1rem;">arrow_back</span> Volver al Torneo
                </a>
            </div>
        </section>

        <div id="admin-panel" style="display:none;">
            <header class="app-header">
                <div class="admin-header">
                    <div class="header-brand">
                        <h1>Admin</h1>
                    </div>
                    <div id="tournament-selector-wrap" style="display:none;margin-left:0.75rem;">
                        <select id="tournament-selector" class="tournament-select"></select>
                    </div>
                    <div style="display:flex;gap:0.5rem;align-items:center;margin-left:auto;">
                        <a href="index.html" class="logout-btn" style="text-decoration:none;">
                            <span class="material-symbols-outlined" style="font-size:0.9rem;">arrow_back</span> Volver
                        </a>
                        <button class="logout-btn" id="logout-btn">
                            <span class="material-symbols-outlined" style="font-size:0.9rem;">logout</span> Salir
                        </button>
                    </div>
                </div>
                <div class="header-line"></div>
                <div class="tab-nav-wrap">
                <nav class="tab-nav">
                    <button class="admin-tab-btn active" data-panel="jugadores" onclick="showPanel('jugadores')">
                        <span class="material-symbols-outlined">groups</span> <span class="tab-label">Jugadores</span>
                    </button>
                    <button class="admin-tab-btn" data-panel="resultados" onclick="showPanel('resultados')">
                        <span class="material-symbols-outlined">sports_score</span> <span class="tab-label">Resultados</span>
                    </button>
                    <button class="admin-tab-btn" data-panel="posiciones" onclick="showPanel('posiciones')">
                        <span class="material-symbols-outlined">leaderboard</span> <span class="tab-label">Posiciones</span>
                    </button>
                    <div class="tab-more-wrap">
                        <button class="tab-more-btn" id="tab-more-btn-admin" aria-label="Más opciones">
                            <span class="material-symbols-outlined">expand_more</span> Más
                        </button>
                    </div>
                </nav>
                <div class="tab-dropdown" id="tab-dropdown-admin">
                    <button class="admin-tab-btn" data-panel="equipos" onclick="showPanel('equipos')">
                        <span class="material-symbols-outlined">palette</span> Equipos
                    </button>
                    <button class="admin-tab-btn" data-panel="draw" onclick="showPanel('draw')">
                        <span class="material-symbols-outlined">sports_tennis</span> DRAW
                    </button>
                    <button class="admin-tab-btn" data-panel="jornadas" onclick="showPanel('jornadas')">
                        <span class="material-symbols-outlined">event</span> Jornadas
                    </button>
                    <button class="admin-tab-btn" data-panel="semifinales" onclick="showPanel('semifinales')">
                        <span class="material-symbols-outlined">emoji_events</span> Semifinales
                    </button>
                    <button class="admin-tab-btn" data-panel="final" onclick="showPanel('final')">
                        <span class="material-symbols-outlined">workspace_premium</span> Final
                    </button>
                    <button class="admin-tab-btn" data-panel="categorias" onclick="showPanel('categorias')">
                        <span class="material-symbols-outlined">sell</span> Categorías
                    </button>
                    <button class="admin-tab-btn" data-panel="correos" onclick="showPanel('correos')">
                        <span class="material-symbols-outlined">email</span> Correos
                    </button>
                    <button class="admin-tab-btn" data-panel="torneos" onclick="showPanel('torneos')">
                        <span class="material-symbols-outlined">settings</span> Torneos
                    </button>
                    <button class="admin-tab-btn" data-panel="administracion" onclick="showPanel('administracion')">
                        <span class="material-symbols-outlined">account_balance_wallet</span> Administración
                    </button>
                    <button class="admin-tab-btn" data-panel="usuarios" id="tab-usuarios-dropdown" onclick="showPanel('usuarios')" style="display:none;">
                        <span class="material-symbols-outlined">manage_accounts</span> Usuarios
                    </button>
                </div>
                </div>
            </header>

            <div id="panel-jugadores" class="admin-panel active"></div>
            <div id="panel-equipos" class="admin-panel"></div>
            <div id="panel-draw" class="admin-panel"></div>
            <div id="panel-resultados" class="admin-panel"></div>
            <div id="panel-posiciones" class="admin-panel"></div>
            <div id="panel-jornadas" class="admin-panel"></div>
            <div id="panel-semifinales" class="admin-panel"></div>
            <div id="panel-final" class="admin-panel"></div>
            <div id="panel-categorias" class="admin-panel"></div>
            <div id="panel-correos" class="admin-panel"></div>
            <div id="panel-torneos" class="admin-panel"></div>
            <div id="panel-administracion" class="admin-panel"></div>
            <div id="panel-usuarios" class="admin-panel"></div>
        </div>
    </main>

    <div class="modal-overlay" id="finance-modal-overlay" style="display:none;">
        <div class="modal">
            <h3>Otro Ingreso</h3>
            <div class="form-row">
                <div class="form-group"><label>Fecha</label><input type="date" id="fm-fecha"></div>
                <div class="form-group"><label>Moneda</label><select id="fm-moneda"><option value="EUR">EUR</option><option value="USD">USD</option><option value="Bs">Bs</option></select></div>
            </div>
            <div class="form-group"><label>Concepto</label><input type="text" id="fm-concepto" placeholder="Ej: Patrocinio"></div>
            <div class="form-group"><label>Monto</label><input type="number" id="fm-monto" placeholder="0" step="0.01" min="0.01"></div>
            <div class="fm-equivalente" id="fm-equivalente" style="display:none;"></div>
            <div class="form-group"><label>Observación</label><input type="text" id="fm-observacion" placeholder="Opcional"></div>
            <div class="btn-group" style="justify-content:flex-end;">
                <button class="btn btn-outline" onclick="closeFinanceModal()"><span class="material-symbols-outlined" style="font-size:1rem;">close</span> Cancelar</button>
                <button class="btn btn-primary" id="fm-btn-save" onclick="saveFinanceModal()"><span class="material-symbols-outlined" style="font-size:1rem;">add</span> Guardar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="user-modal-overlay" style="display:none;">
        <div class="modal">
            <h3 id="um-titulo">Nuevo Usuario</h3>
            <div class="form-group"><label>Nombre</label><input type="text" id="um-nombre" placeholder="Nombre completo"></div>
            <div class="form-group"><label>Email</label><input type="email" id="um-email" placeholder="email@ejemplo.com"></div>
            <div class="form-group" id="um-password-group"><label>Contraseña</label><input type="password" id="um-password" placeholder="Mínimo 6 caracteres"></div>
            <div class="form-group">
                <label>Rol</label>
                <select id="um-rol">
                    <option value="FULL">FULL - Administrador</option>
                    <option value="MARCADORES">MARCADORES - Marcadores</option>
                </select>
            </div>
            <div class="form-group" id="um-estado-group" style="display:none;">
                <label>Estado</label>
                <select id="um-estado">
                    <option value="true">ACTIVO</option>
                    <option value="false">INACTIVO</option>
                </select>
            </div>
            <div id="um-error" style="display:none;background:var(--error-container);color:white;border:1px solid rgba(255,84,73,0.3);border-radius:8px;padding:0.6rem 0.8rem;margin-bottom:0.75rem;font-size:0.82rem;"></div>
            <div class="btn-group" style="justify-content:flex-end;">
                <button class="btn btn-outline" onclick="closeUserModal()"><span class="material-symbols-outlined" style="font-size:1rem;">close</span> Cancelar</button>
                <button class="btn btn-primary" id="um-btn-save" onclick="saveUserModal()"><span class="material-symbols-outlined" style="font-size:1rem;">person_add</span> Crear</button>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        <p>Powered by JDM Group Tech</p>
    </footer>

    <script type="module" src="js/admin.js?v=59"></script>

</body>
</html>

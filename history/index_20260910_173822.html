<body>

<header class="app-header">
    <div class="header-top">
        <div class="header-brand">
            <div>
                <h1>Torneo de Colores</h1>
                <div class="header-subtitle"><span class="dot"></span> Septiembre 2026</div>
                <div class="header-hashtag">#JDMRules</div>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:0.5rem;">
            <div class="header-tennis">&#127934;</div>
            <a href="admin.html" class="admin-link" title="Admin">
                <span class="material-symbols-outlined" style="font-size:1.1rem;">lock</span>
            </a>
        </div>
    </div>
    <div class="header-line"></div>
    <div id="public-tournament-selector-wrap" class="tournament-bar" style="display:none;">
        <span class="material-symbols-outlined tournament-bar-icon">swap_horiz</span>
        <span class="tournament-bar-label">Cambiar Torneo</span>
        <select id="public-tournament-selector" class="tournament-select-bar"></select>
    </div>
    <div class="tab-nav-wrap">
        <nav class="tab-nav">
            <button data-tab="posiciones" class="active" onclick="showTab('posiciones')">
                <span class="material-symbols-outlined">leaderboard</span> <span class="tab-label">Posiciones</span>
            </button>
            <button data-tab="resultados" onclick="showTab('resultados')">
                <span class="material-symbols-outlined">history</span> <span class="tab-label">Resultados</span>
            </button>
            <div class="tab-more-wrap">
                <button class="tab-more-btn" id="tab-more-btn" aria-label="Más opciones">
                    <span class="material-symbols-outlined">expand_more</span> Más
                </button>
            </div>
        </nav>
        <div class="tab-dropdown" id="tab-dropdown">
            <button data-tab="semifinales" onclick="showTab('semifinales')">
                <span class="material-symbols-outlined">emoji_events</span> Playoffs
            </button>
            <button data-tab="final" onclick="showTab('final')">
                <span class="material-symbols-outlined">workspace_premium</span> Final
            </button>
            <button data-tab="inicio" onclick="showTab('inicio')">
                <span class="material-symbols-outlined">home</span> Info
            </button>
        </div>
    </div>
</header>

<main id="app">
    <section id="posiciones" class="tab-content active"></section>
    <section id="resultados" class="tab-content"></section>
    <section id="semifinales" class="tab-content"></section>
    <section id="final" class="tab-content"></section>
    <section id="inicio" class="tab-content"></section>
</main>

<footer class="app-footer">
        <p>Powered by JDM Group Tech</p>
    </footer>

    <script type="module" src="js/app.js?v=39"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((error) => {
                    console.log('[SW] Registration failed:', error);
                });
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                if (!sessionStorage.getItem('sw-reloaded')) {
                    sessionStorage.setItem('sw-reloaded', '1');
                    location.reload();
                }
            });
        }
    </script>

</body>
